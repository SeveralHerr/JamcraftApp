version: 1
applications:
  - appRoot: thanksgiving
    backend:
      phases:
        build:
          commands:
            - nvm install 20 && nvm use 20
            - npm install --no-audit --no-fund --cache .npm --prefer-offline
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        build:
          commands:
            - npm test -- --run
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
