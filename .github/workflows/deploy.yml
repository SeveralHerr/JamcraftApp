name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: jamcraft-app/package-lock.json

      - name: Install dependencies
        working-directory: jamcraft-app
        run: npm ci

      - name: Lint
        working-directory: jamcraft-app
        run: npm run lint

      - name: Run tests with coverage thresholds
        working-directory: jamcraft-app
        run: npm run test:coverage

      - name: Audit dependencies (high and critical)
        working-directory: jamcraft-app
        run: npm audit --audit-level=high

      - name: Build application
        working-directory: jamcraft-app
        run: npm run build
