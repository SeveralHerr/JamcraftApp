<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#efe1c8">
<meta name="description" content="Sign up for what you're bringing to Thanksgiving.">
<title>Thanksgiving Potluck Sign-Up</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Thanksgiving potluck: what are you bringing?">
<meta property="og:description" content="Tap to see the menu and sign up for a dish. No account needed.">
<meta property="og:image" content="https://thanksgiving.jamcraft.io/img/turkey.jpg">
<meta name="twitter:card" content="summary">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/pinyon-script-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>
<div class="wrap">
  <div class="side" id="side">
  <header class="invite card">
    <svg class="pleaf pleaf-maple" viewBox="0 0 100 112" aria-hidden="true" focusable="false">
      <defs>
        <filter id="pressedTex" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="4" result="n"/>
          <feColorMatrix in="n" values="0 0 0 0 .22  0 0 0 0 .12  0 0 0 0 .05  0 0 0 -1.6 1.05" result="spots"/>
          <feComposite in="spots" in2="SourceGraphic" operator="in" result="tex"/>
          <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="tex"/></feMerge>
        </filter>
        <radialGradient id="pl-maple" cx="50%" cy="62%" r="62%"><stop offset="0" stop-color="#c98a3a"/><stop offset=".55" stop-color="#b0582c"/><stop offset="1" stop-color="#8f3b24"/></radialGradient>
        <linearGradient id="pl-oak" x1="0" y1="1" x2=".4" y2="0"><stop offset="0" stop-color="#7c7a4c"/><stop offset=".6" stop-color="#8e8550"/><stop offset="1" stop-color="#b08a43"/></linearGradient>
        <linearGradient id="pl-birch" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a23a42"/><stop offset="1" stop-color="#7a2431"/></linearGradient>
      </defs>
      <g filter="url(#pressedTex)">
        <path d="M50 4 54 20 61 16 59 34 70 27 72 33 80 31 77 40 91 42 86 47 95 52 79 64 82 71 70 71 68 79 56 74 51 82 51 100 49 100 49 82 44 74 32 79 30 71 18 71 21 64 5 52 14 47 9 42 23 40 20 31 28 33 30 27 41 34 39 16 46 20Z" fill="url(#pl-maple)" stroke="#7b3220" stroke-width=".6" stroke-linejoin="round"/>
        <path d="M50 108C50 100 50 92 50 82" fill="none" stroke="#7b3a20" stroke-width="1.6" stroke-linecap="round"/>
        <g class="vein" stroke="#e7b77a" stroke-width=".9" opacity=".65"><path d="M50 82 50 9M50 70 86 46M50 70 14 46M50 74 74 70M50 74 26 70"/></g>
        <g class="vein" stroke="#e2ad6e" stroke-width=".45" opacity=".55"><path d="M50 30 41 22M50 30 59 22M50 46 38 36M50 46 62 36M50 58 34 50M50 58 66 50M64 60 72 36M68 57 85 57M36 60 28 36M32 57 15 57M62 72 66 66M38 72 34 66M58 64 60 72M42 64 40 72"/></g>
      </g>
    </svg>
    <svg class="pleaf pleaf-birch" viewBox="0 0 60 96" aria-hidden="true" focusable="false">
      <g filter="url(#pressedTex)">
        <path d="M30 4C38 12 47 22 50 36 53 50 46 64 30 78 14 64 7 50 10 36 13 22 22 12 30 4Z" fill="url(#pl-birch)" stroke="#5e1a24" stroke-width=".6"/>
        <path d="M30 78 31 94" fill="none" stroke="#5e1a24" stroke-width="1.5" stroke-linecap="round"/>
        <g class="vein" stroke="#d9868a" stroke-width=".8" opacity=".6"><path d="M30 78V10"/></g>
        <g class="vein" stroke="#d9868a" stroke-width=".45" opacity=".55"><path d="M30 22 40 16M30 22 20 16M30 34 45 26M30 34 15 26M30 46 48 39M30 46 12 39M30 58 46 52M30 58 14 52M30 68 39 64M30 68 21 64"/></g>
      </g>
    </svg>
    <div class="polaroids" aria-hidden="true">
      <figure class="pol p1"><span class="tape"></span><img src="/img/cranberries.jpg" alt="" width="350" height="350" decoding="async"><figcaption>cranberries</figcaption></figure>
      <figure class="pol p2"><span class="tape"></span><img src="/img/turkey.jpg" alt="" width="350" height="350" decoding="async"><figcaption>the bird</figcaption></figure>
      <figure class="pol p3"><span class="tape"></span><img src="/img/pie.jpg" alt="" width="233" height="233" decoding="async"><figcaption>pie!</figcaption></figure>
    </div>
    <p class="kicker">You’re invited to a</p>
    <h1 id="title">Thanksgiving</h1>
    <p class="sub2">potluck supper</p>
    <div class="orn" aria-hidden="true">❦</div>
    <div class="meta" id="meta"></div>
    <p class="subtitle" id="subtitle"><span id="subtitleText">What are you bringing? Sign the menu</span><svg class="sub-arrow" viewBox="0 0 32 38" aria-hidden="true"><path d="M1 13C7 5 18 3 19 10c1 6-8 8-9 3-1-6 11-8 14 0 2 6 0 14-4 22"/><path d="M14.5 30.5L20 35.5l4.5-6.5"/></svg></p>
  </header>
  <aside class="card guests guests-card" id="guestsSide" aria-label="At the table" hidden></aside>
  </div>

  <div id="notice" role="status"><noscript><div class="notice">This sign-up sheet needs JavaScript turned on.</div></noscript></div>

  <section class="menu card" aria-labelledby="menuTitle">
    <div class="menu-head">
      <h2 id="menuTitle">The Menu</h2>
      <p id="menuSub">Anyone can sign any course — bring one dish or several</p>
    </div>
    <div class="summary" id="summary" hidden>
      <div class="sum-top"><span id="sumText"></span><span id="sumPct"></span></div>
      <div class="sum-people" id="sumPeople"></div>
      <div class="bar" role="progressbar" aria-label="Spots filled" aria-valuemin="0" aria-valuemax="100" id="sumBarWrap"><i id="sumBar" style="width:0"></i></div>
      <p id="sumNeed"></p>
    </div>
    <div id="list">
      <div class="sk-menu" aria-hidden="true">
        <div class="sk-course"><div class="sk-head"><span class="sk-pol"><i></i></span><span class="sk-title"><i class="sk-h"></i><i class="sk-s"></i></span></div><div class="sk-row"><i class="sk-dish"></i><i class="sk-lead"></i><i class="sk-who"></i></div><div class="sk-row"><i class="sk-dish w2"></i><i class="sk-lead"></i><i class="sk-who w2"></i></div></div>
        <div class="sk-course"><div class="sk-head"><span class="sk-pol"><i></i></span><span class="sk-title"><i class="sk-h w2"></i><i class="sk-s w2"></i></span></div><div class="sk-row"><i class="sk-dish w3"></i><i class="sk-lead"></i><i class="sk-who"></i></div><div class="sk-row"><i class="sk-dish"></i><i class="sk-lead"></i><i class="sk-who w3"></i></div></div>
        <div class="sk-course"><div class="sk-head"><span class="sk-pol"><i></i></span><span class="sk-title"><i class="sk-h w3"></i><i class="sk-s"></i></span></div><div class="sk-row"><i class="sk-dish w2"></i><i class="sk-lead"></i><i class="sk-who w2"></i></div><div class="sk-row"><i class="sk-dish w3"></i><i class="sk-lead"></i><i class="sk-who"></i></div></div>
      </div>
      <p class="sk-caption" role="status">Setting the table…</p>
    </div>
    <div class="guests" id="guests" hidden></div>
    <svg class="pleaf pleaf-oak" viewBox="0 0 60 120" aria-hidden="true" focusable="false"><g filter="url(#pressedTex)"><path d="M30 100C24 100 20 104 17 98 11 98 7 92 13 86 5 84 4 74 13 71 5 66 6 56 15 55 8 48 10 38 19 40 14 30 18 20 26 22 24 12 28 6 30 6 32 6 36 12 34 22 42 20 46 30 41 40 50 38 52 48 45 55 54 56 55 66 47 71 56 74 55 84 47 86 53 92 49 98 43 98 40 104 36 100 30 100Z" fill="url(#pl-oak)" stroke="#57532e" stroke-width=".6" stroke-linejoin="round"/><path d="M30 100 31 117" fill="none" stroke="#5a5430" stroke-width="1.6" stroke-linecap="round"/><g class="vein" stroke="#d8cf98" stroke-width=".85" opacity=".6"><path d="M30 104V10"/></g><g class="vein" stroke="#d8cf98" stroke-width=".45" opacity=".55"><path d="M30 26 22 22M30 26 38 22M30 40 18 34M30 40 43 34M30 54 13 48M30 54 47 48M30 66 11 62M30 66 50 62M30 80 12 78M30 80 49 78M30 92 18 94M30 92 44 94"/></g></g></svg>
    <div class="sign-off" aria-hidden="true"><span class="script"><svg class="pleaf pleaf-wheat" viewBox="0 0 40 120" aria-hidden="true" focusable="false"><g filter="url(#pressedTex)"><path d="M21 118C20 92 21 66 20 30" fill="none" stroke="#a88a4a" stroke-width="1.6" stroke-linecap="round"/><path d="M20 70c-6 6-11 14-13 22M20 74c5 5 9 12 10 19" fill="none" stroke="#9aa07a" stroke-width="1.1" stroke-linecap="round" opacity=".8"/><g fill="#c9a256" stroke="#8e6b2c" stroke-width=".6"><ellipse cx="20" cy="22" rx="3.2" ry="7"/><ellipse cx="15.5" cy="32" rx="3.4" ry="7" transform="rotate(-24 15.5 32)"/><ellipse cx="24.5" cy="34" rx="3.4" ry="7" transform="rotate(24 24.5 34)"/><ellipse cx="15" cy="43" rx="3.5" ry="7.2" transform="rotate(-26 15 43)"/><ellipse cx="25" cy="45" rx="3.5" ry="7.2" transform="rotate(26 25 45)"/><ellipse cx="15.5" cy="54" rx="3.4" ry="7" transform="rotate(-24 15.5 54)"/><ellipse cx="24.5" cy="56" rx="3.4" ry="7" transform="rotate(24 24.5 56)"/><ellipse cx="17" cy="64" rx="3" ry="6" transform="rotate(-18 17 64)"/></g><g class="vein" stroke="#8e6b2c" stroke-width=".45" opacity=".7"><path d="M20 15V2M14 26 9 12M26 28l5-14M13 37 6 24M27 39l7-13M13 48 5 36M27 50l8-12"/></g><g class="vein" stroke="#7a5a22" stroke-width=".35" opacity=".55"><path d="M20 17v10M15.5 27v9M24.5 29v9M15 38v9M25 40v9M15.5 49v9M24.5 51v9"/></g></g></svg>with gratitude</span></div>
  </section>
  <footer><span>Photos: Pexels &amp; USDA, public domain</span></footer>
</div>

<div class="scrim" id="scrim">
  <form class="sheet" id="sheet" autocomplete="on" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
    <span class="grab" aria-hidden="true"></span>
    <button type="button" class="sheet-x" id="sheetX" aria-label="Close">✕</button>
    <span class="sheet-pol" id="sheetPol" aria-hidden="true" hidden><span class="tape"></span><img alt="" id="sheetPolImg" width="62" height="56" decoding="async"></span>
    <h3 id="sheetTitle">I’ll bring…</h3>
    <p class="sheet-sub" id="sheetSub"></p>
    <div id="sheetFields"></div>
    <p class="err-text" id="sheetErr"></p>
    <div class="row">
      <button type="button" class="btn ghost" id="cancel">Cancel</button>
      <button type="submit" class="btn primary" id="save">Save</button>
    </div>
    <div class="sheet-extra" id="sheetExtra"></div>
  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
